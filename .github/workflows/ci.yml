name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile and dependency checks
        run: |
          python -m compileall -q src tests examples
          python -m pip check
      - name: Offline CLI and example acceptance
        shell: bash
        run: |
          root="${RUNNER_TEMP}/merit-results"
          merit demo --seed-count 2 --budget 4 --output "${root}/toy"
          merit agent-demo --budget 2 --output "${root}/agent"
          merit paired-agent-demo --seed-count 2 --budget 2 --output "${root}/paired"
          merit transfer-demo --budget 2 --output "${root}/transfer"
          merit plasticity-demo --trajectory-count 2 --seed-count 2 --budget 2 --output "${root}/plasticity"
          python examples/custom_executor.py --output "${root}/custom"
          for result in toy agent paired transfer plasticity custom; do
            merit validate "${root}/${result}"
          done
          merit compress-evidence "${root}/plasticity/evidence.json" --output "${root}/plasticity/evidence.json.gz"
      - name: Validate bundled real-model evidence without network access
        shell: bash
        run: |
          for result in \
            results/real-llm \
            results/real-llm/transfer-seed-101 \
            results/real-llm/transfer-seed-202 \
            results/real-agent \
            results/real-agent/transfer; do
            merit validate "${result}"
          done

  optional-local-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional integrations
        run: python -m pip install -e '.[langgraph,yaml]'
      - name: Test local model configuration and LangGraph without network access
        run: python -m unittest discover -s tests -p 'test_local_experiment.py' -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Check wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          assert "merit/schemas/evidence-envelope.schema.json" in names
          assert any(name.endswith(".dist-info/entry_points.txt") for name in names)
          print(f"Checked {wheel}: schema and CLI entry point included")
          PY
